version: '3.8'

services:
  crawler-api:
    build: .
    container_name: course-crawler-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # credentials.py 마운트 (로컬 파일 사용 시)
      - ./credentials.py:/app/credentials.py:ro
      # 크롤링 결과 저장 (output 파일들)
      - ./output:/app/output
      # 스크린샷 저장
      - ./screenshots:/app/screenshots
    restart: unless-stopped
    # MySQL 네트워크에 연결
    networks:
      - default
      - mysql-network
    # 헬스체크
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mysql-network:
    external: true
    name: db_mysql-network
