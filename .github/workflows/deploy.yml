name: Deploy Crawler API

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug secrets
        run: |
          echo "HOST length: ${#HOST}"
          echo "PORT value: $PORT"
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 1122
          debug: true
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # 최신 코드 pull
            git pull origin main

            # credentials.py 생성 (GitHub Secrets에서)
            cat > credentials.py << 'EOF'
            MYSQL_HOST = '${{ secrets.MYSQL_HOST }}'
            MYSQL_PORT = ${{ secrets.MYSQL_PORT }}
            MYSQL_USER = '${{ secrets.MYSQL_USER }}'
            MYSQL_PASSWORD = '${{ secrets.MYSQL_PASSWORD }}'
            MYSQL_DATABASE = '${{ secrets.MYSQL_DATABASE }}'

            KAKAO_EMAIL = '${{ secrets.KAKAO_EMAIL }}'
            KAKAO_PASSWORD = '${{ secrets.KAKAO_PASSWORD }}'
            EOF

            # Docker 컨테이너 재빌드 및 실행
            docker-compose down
            docker-compose up -d --build

            # 정리 (오래된 이미지 삭제)
            docker image prune -f

            echo "✅ Deployment completed!"
